<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo de Filmes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="logo-tag">TOP FILMES</span>
      <h1>Catálogo de Filmes</h1>
      <p class="subtitle">Os maiores clássicos do cinema mundial</p>
    </div>
    <div class="header-stripe"></div>
  </header>

  <main>
    <section class="controls">
      <div class="search-bar">
        <input id="search" type="text" placeholder="Buscar filme..." autocomplete="off" />
        <button id="btnSearch">Buscar</button>
      </div>
      <div class="filters">
        <label for="filter">Filtrar por:</label>
        <select id="filter">
          <option value="all">Todos</option>
          <option value="drama">Drama</option>
          <option value="crime">Crime</option>
          <option value="acao">Ação</option>
        </select>
      </div>
    </section>

    <p id="message"></p>
    <div id="movie-list"></div>
  </main>

  <footer>
    <p>Dados fornecidos por <a href="https://www.themoviedb.org" target="_blank">The Movie DB</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
